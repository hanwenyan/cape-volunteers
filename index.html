<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121836" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Volunteers" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>CAPE · Mrs. White’s Class Volunteers (2026–27)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      /* CAPE (Camarillo Academy of Progressive Education) Palette */
      --cape-navy: #121836;
      --cape-blue: #384169;
      --cape-maroon: #7C1035;
      --cape-sky: #A5C7DF;

      --bg-canvas: #F5F7FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EDF1F7;
      --bg-muted: #E0E7F1;

      --ink-primary: #121836;
      --ink-secondary: #384169;
      --ink-tertiary: #646E8F;

      --border-hairline: #DDE4EE;
      --border-strong: #B8C7DA;

      --amber-surface: #FEF6E7;
      --amber-border: #F3CE85;
      --amber-ink: #7A4306;
      --amber-accent: #C26E10;

      --rose-surface: #FDF0F3;
      --rose-border: #E8B8C6;
      --rose-ink: #7C1035;

      --sky-surface: #ECF3F9;
      --sky-border: #B8D2E6;

      --font-display: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --shadow-sm: 0 1px 3px rgba(18, 24, 54, 0.05);
      --shadow-float: 0 14px 34px rgba(18, 24, 54, 0.18), 0 2px 6px rgba(18, 24, 54, 0.08);
      --radius-card: 14px;
      --radius-pill: 999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--sky-surface);
      color: var(--cape-navy);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding-bottom: calc(84px + var(--safe-bottom));
      min-height: 100dvh;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--cape-maroon);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* Sticky Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(18, 24, 54, 0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 3px solid var(--cape-maroon);
      margin: 0 -14px;
      padding: 11px 14px 11px;
      color: #FFFFFF;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin: 0;
    }

    .identity-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(165, 199, 223, 0.4);
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 600;
      max-width: 215px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .identity-pill-btn.unselected {
      background: var(--cape-maroon);
      border-color: #A3244F;
      font-weight: 700;
    }

    .header-sync-btn {
      margin-top: 3px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px 2px 0;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--cape-sky);
      line-height: 1.2;
      transition: opacity 0.15s ease;
    }

    .header-sync-btn:active {
      opacity: 0.72;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94A3B8;
      flex-shrink: 0;
    }

    .sync-dot.synced {
      background: #34D399;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.25);
    }

    .sync-dot.syncing {
      background: var(--cape-sky);
    }

    .sync-dot.error {
      background: #FBBF24;
    }

    .sync-spin-icon {
      opacity: 0.85;
      flex-shrink: 0;
    }

    .header-sync-btn.is-syncing .sync-spin-icon {
      animation: spinSync 0.9s linear infinite;
    }

    @keyframes spinSync {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Sticky Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-hairline);
      padding-bottom: var(--safe-bottom);
      box-shadow: 0 -2px 10px rgba(18, 24, 54, 0.06);
    }

    .bottom-nav-inner {
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 62px;
    }

    .mode-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--ink-tertiary);
      position: relative;
      transition: color 0.12s ease;
    }

    .mode-btn.active {
      color: var(--cape-maroon);
      font-weight: 700;
    }

    .mode-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      width: 40px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: var(--cape-maroon);
    }

    .count-dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 26px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      border-radius: var(--radius-pill);
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--cape-maroon);
      color: #FFFFFF;
    }

    .count-dot.calm {
      background: var(--cape-blue);
    }

    /* Your Next Shift Spotlight Banner */
    .next-shift-banner {
      background: var(--bg-surface);
      border: 1.5px solid var(--cape-blue);
      border-radius: var(--radius-card);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .next-shift-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .next-shift-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--cape-maroon);
      background: var(--rose-surface);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .next-shift-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .mini-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      background: var(--bg-subtle);
      color: var(--ink-primary);
      border: 1px solid var(--border-hairline);
    }

    .mini-btn.maroon {
      background: var(--rose-surface);
      border-color: var(--rose-border);
      color: var(--cape-maroon);
    }

    /* Horizontal Month Selector */
    .month-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px 10px;
      margin: 0 -2px 4px;
      scrollbar-width: none;
    }

    .month-strip::-webkit-scrollbar {
      display: none;
    }

    .month-pill {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .month-pill.active {
      background: var(--cape-navy);
      border-color: var(--cape-navy);
      color: #FFFFFF;
    }

    /* Collapsible Monthly Roles Summary Details */
    details.monthly-roles-drawer {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    details.monthly-roles-drawer summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 14px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFBFD;
    }

    details.monthly-roles-drawer summary::-webkit-details-marker {
      display: none;
    }

    /* Compact Day Card */
    .day-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .day-card.today-card {
      border-color: var(--cape-maroon);
      box-shadow: 0 0 0 1px var(--cape-maroon), var(--shadow-sm);
    }

    .day-card.has-open-slots {
      border-color: #EAB308;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.1);
    }

    .day-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .day-card.min-day .day-header {
      background: var(--amber-surface);
      border-bottom-color: var(--amber-border);
    }

    .day-card.special-day .day-header {
      background: var(--sky-surface);
      border-bottom-color: var(--sky-border);
    }

    .day-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .badge.min-day {
      background: #FDE5B4;
      color: var(--amber-ink);
    }

    .badge.special {
      background: var(--cape-blue);
      color: #FFFFFF;
    }

    .day-context-note {
      padding: 7px 14px;
      font-size: 0.78rem;
      color: var(--ink-secondary);
      background: #F9FBFD;
      border-bottom: 1px solid var(--border-hairline);
    }

    .day-card.min-day .day-context-note {
      background: #FFFDF7;
      color: var(--amber-ink);
    }

    /* Grouped Shift Block inside a Day Card */
    .shift-group {
      padding: 10px 14px;
    }

    .shift-group+.shift-group {
      border-top: 1px solid var(--border-hairline);
    }

    .shift-group-label {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--ink-tertiary);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .volunteer-pills-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .vol-chip {
      width: 100%;
      text-align: left;
      padding: 8px 11px;
      border-radius: 9px;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-primary);
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .vol-chip:hover,
    .vol-chip:active {
      border-color: var(--border-strong);
      background: #E4ECF5;
    }

    .vol-chip.is-mine {
      background: var(--sky-surface);
      border-color: var(--cape-sky);
      font-weight: 700;
    }

    .vol-chip.is-open {
      background: #FEF3C7;
      border: 2px dashed #D97706;
      color: #78350F;
      font-weight: 700;
      padding: 10px 11px;
      box-shadow: 0 1px 4px rgba(217, 119, 6, 0.16);
    }

    .vol-chip.is-open:hover, .vol-chip.is-open:active {
      background: #FDE68A;
      border-color: #B45309;
    }

    .vol-chip.is-sub-needed {
      background: var(--rose-surface);
      border: 2px solid var(--cape-maroon);
      color: var(--rose-ink);
      font-weight: 700;
      padding: 10px 11px;
    }

    .chip-right {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--ink-tertiary);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Unified CTA button shared identically across Schedule and Needs Help */
    .claim-cta-btn {
      background: var(--cape-maroon);
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(124, 16, 53, 0.24);
    }

    .open-slot-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      background: #D97706;
      color: #FFFFFF;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .sub-needed-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--cape-maroon);
      color: #FFFFFF;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .badge.open-alert {
      background: #D97706;
      color: #FFFFFF;
    }

    .you-pill {
      background: var(--cape-navy);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
    }

    .day-note-footer {
      padding: 8px 14px;
      background: #FAFBFD;
      border-top: 1px solid var(--border-hairline);
      font-size: 0.78rem;
      color: var(--ink-secondary);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .no-school-row {
      padding: 8px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: var(--bg-subtle);
      color: var(--ink-tertiary);
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Bottom Sheet Dialog (<dialog>) */
    dialog.bottom-sheet {
      margin: auto 0 0 0;
      width: 100%;
      max-width: 100%;
      border: none;
      padding: 0;
      background: transparent;
      max-height: 92dvh;
    }

    dialog.bottom-sheet::backdrop {
      background: rgba(18, 24, 54, 0.5);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .sheet-panel {
      max-width: 540px;
      margin: 0 auto;
      background: var(--bg-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow-float);
      padding: 14px 18px calc(22px + var(--safe-bottom));
      max-height: 90dvh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 99px;
      margin: 0 auto 12px;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .sheet-title {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      margin: 0;
    }

    .sheet-subtitle {
      font-size: 0.82rem;
      color: var(--ink-secondary);
      margin-top: 2px;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      flex-shrink: 0;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-primary);
      margin-bottom: 5px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      font-size: 0.94rem;
      color: var(--ink-primary);
    }

    .primary-cta {
      width: 100%;
      padding: 12px 16px;
      border-radius: 11px;
      background: var(--cape-maroon);
      color: #FFFFFF;
      font-size: 0.94rem;
      font-weight: 700;
      text-align: center;
    }

    .secondary-cta {
      width: 100%;
      padding: 11px 16px;
      border-radius: 11px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      color: var(--ink-primary);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .empty-state {
      background: var(--bg-surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-card);
      padding: 24px 16px;
      text-align: center;
      margin: 12px 0;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: calc(74px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: calc(100% - 28px);
      max-width: 420px;
      pointer-events: none;
    }

    .toast-box {
      background: var(--cape-navy);
      color: #FFFFFF;
      padding: 11px 14px;
      border-radius: 11px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-float);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toast-box.error {
      background: var(--cape-maroon);
    }

    .toast-undo-btn {
      flex-shrink: 0;
      padding: 5px 11px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }

    .my-shifts-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 2px 2px;
    }

    .skeleton-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-card);
      padding: 14px;
      margin-bottom: 10px;
    }

    .skeleton-bar {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--bg-muted) 50%, var(--bg-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmerSkeleton 1.2s ease-in-out infinite;
    }

    @keyframes shimmerSkeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body>

  <div class="app-shell">
    <!-- Clean 1-Row Sticky Header -->
    <header class="top-header">
      <div class="header-row">
        <div>
          <h1 class="brand-title">Mrs. White’s Volunteers</h1>
          <button type="button" class="header-sync-btn" id="headerSyncBtn" aria-label="Sync schedule with Google Sheet">
            <span class="sync-dot" id="headerSyncDot"></span>
            <span id="headerSyncText">Loading schedule…</span>
            <svg class="sync-spin-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>
        <button type="button" class="identity-pill-btn unselected" id="identityBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>

    <!-- Main Content -->
    <main id="mainContainer" aria-live="polite" style="margin-top: 12px;"></main>

    <!-- Quiet Footer Links -->
    <footer
      style="margin: 24px 0 12px; text-align: center; font-size: 0.76rem; color: var(--ink-tertiary); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
      <button type="button" id="footerSyncBtn" style="text-decoration: underline;">Refresh</button>
      <span>·</span>
      <button type="button" id="footerActivityBtn" style="text-decoration: underline;">Recent Changes</button>
      <span>·</span>
      <button type="button" id="footerRosterBtn" style="text-decoration: underline;">Original Sign-Ups</button>

  <!-- Sticky Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Primary navigation">
    <div class="bottom-nav-inner">
      <button type="button" class="mode-btn active" data-filter-mode="mine">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <polyline points="16 11 18 13 22 9"></polyline>
        </svg>
        <span>My Shifts</span>
        <span class="count-dot calm tabular-nums" id="myShiftsCount" hidden>0</span>
      </button>
      <button type="button" class="mode-btn" data-filter-mode="open">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span>Needs Help</span>
        <span class="count-dot tabular-nums" id="openCount" hidden>0</span>
      </button>
      <button type="button" class="mode-btn" data-filter-mode="schedule">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Schedule</span>
      </button>
    </div>
  </nav>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer" hidden></div>

  <!-- Context-Aware 1-Tap Bottom Sheet -->
  <dialog class="bottom-sheet" id="actionSheet">
    <div class="sheet-panel" id="actionSheetPanel"></div>
  </dialog>

  <script>
    const DEFAULT_APPS_SCRIPT_URL = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "/api" : "https://script.google.com/macros/s/AKfycbxjb0K3po_9S42bnzwj3V-PPVh4Nn0xnOzhRd9PHrVvlndMcjQvqKzJvE9ryz6vs6g2/exec";

    const STORAGE_KEYS = {
      SCHEDULE_CACHE: "CAPE_VOL_SCHEDULE_CACHE_V2",
      PARENT_NAME: "CAPE_VOL_PARENT_NAME_V1",
      API_URL_OVERRIDE: "CAPE_VOL_API_URL_V1"
    };


    const state = {
      data: null,
      mode: "mine", // "mine" | "open" | "schedule"
      selectedMonth: "Nov 2026",
      selectedParent: localStorage.getItem(STORAGE_KEYS.PARENT_NAME) || "",
      showPast: false,
      syncStatus: "idle", // "idle" | "syncing" | "saving" | "synced" | "error"
      lastSyncTimestamp: 0,
      syncInFlight: false,
      syncGeneration: 0,
      syncAbortController: null,
      pendingMutations: 0,
      activityReqId: 0
    };

    let mutationChain = Promise.resolve();

    function getApiUrl() {
      const override = localStorage.getItem(STORAGE_KEYS.API_URL_OVERRIDE);
      if (override && override.trim() !== "") return override.trim();
      return DEFAULT_APPS_SCRIPT_URL.trim();
    }

    function getTodayIsoLA() {
      try {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Los_Angeles",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const y = parts.find(p => p.type === "year").value;
        const m = parts.find(p => p.type === "month").value;
        const d = parts.find(p => p.type === "day").value;
        return `${y}-${m}-${d}`;
      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function determineDefaultMonth(todayIso) {
      const ym = todayIso.slice(0, 7);
      const map = {
        "2026-10": "Oct 2026", "2026-11": "Nov 2026", "2026-12": "Dec 2026",
        "2027-01": "Jan 2027", "2027-02": "Feb 2027", "2027-03": "Mar 2027",
        "2027-04": "Apr 2027", "2027-05": "May 2027", "2027-06": "Jun 2027"
      };
      return map[ym] || "Nov 2026";
    }

    function initApp() {
      state.selectedMonth = determineDefaultMonth(getTodayIsoLA());

      const cached = localStorage.getItem(STORAGE_KEYS.SCHEDULE_CACHE);
      if (cached) {
        try {
          state.data = JSON.parse(cached);
        } catch (_) {
          state.data = null;
        }
      } else {
        state.data = null;
      }

      renderAll();
      bindEvents();

      if (getApiUrl()) {
        syncFromServer(false, false);
      } else {
        renderSyncStatus();
      }
    }

    function formatSyncTime(ts) {
      if (!ts) return "";
      try {
        return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      } catch (_) {
        return "";
      }
    }

    function renderSyncStatus() {
      const btn = document.getElementById("headerSyncBtn");
      const dot = document.getElementById("headerSyncDot");
      const txt = document.getElementById("headerSyncText");
      if (!btn || !dot || !txt) return;

      const isBusy = state.syncStatus === "syncing" || state.syncStatus === "saving";
      btn.classList.toggle("is-syncing", isBusy);
      const dotState = state.syncStatus === "saving" ? "syncing" : state.syncStatus;
      dot.className = "sync-dot" + (dotState !== "idle" ? ` ${dotState}` : "");

      if (!getApiUrl()) {
        txt.textContent = "Not connected · Tap to configure";
      } else if (state.syncStatus === "saving") {
        txt.textContent = "Saving to Google Sheet…";
      } else if (state.syncStatus === "syncing") {
        txt.textContent = "Syncing with Google Sheet…";
      } else if (state.syncStatus === "synced" && state.lastSyncTimestamp) {
        txt.textContent = `Live · Synced ${formatSyncTime(state.lastSyncTimestamp)}`;
      } else if (state.syncStatus === "error") {
        txt.textContent = "Offline (cached) · Tap to retry";
      } else {
        txt.textContent = "Auto-syncs with Google Sheet";
      }
    }

    function abortInFlightSync() {
      if (state.syncAbortController) {
        try { state.syncAbortController.abort(); } catch (_) {}
        state.syncAbortController = null;
      }
      state.syncInFlight = false;
    }

    function mergeSingleMonth(monthObj) {
      if (!state.data || !Array.isArray(state.data.months) || !monthObj) return;
      const idx = state.data.months.findIndex(m => m.tabName === monthObj.tabName);
      if (idx !== -1) state.data.months[idx] = monthObj;
      else state.data.months.push(monthObj);
      localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, JSON.stringify(state.data));
    }

    async function syncFromServer(showFeedback, forceNoCache = showFeedback, forcePreempt = showFeedback) {
      const apiUrl = getApiUrl();
      if (!apiUrl) {
        if (showFeedback) openApiConfigSheet();
        renderSyncStatus();
        return;
      }
      // Never let a background GET start while a write is actively saving
      if (state.pendingMutations > 0 && !forcePreempt) return;

      if (state.syncInFlight) {
        if (!forcePreempt) return;
        abortInFlightSync();
      }

      const gen = ++state.syncGeneration;
      const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
      const signal = controller ? controller.signal : undefined;
      state.syncAbortController = controller;
      state.syncInFlight = true;
      state.syncStatus = "syncing";
      renderSyncStatus();

      try {
        const sep = apiUrl.includes("?") ? "&" : "?";

        if (!state.data) {
          // First-time load: fetch cached full workbook first (~2s) so the UI renders fast
          const fastRes = await fetch(`${apiUrl}${sep}action=all`, { redirect: "follow", signal });
          const fastJson = await fastRes.json();
          if (gen !== state.syncGeneration) return;
          if (fastJson && fastJson.ok) {
            state.data = fastJson;
            state.lastSyncTimestamp = Date.now();
            localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, JSON.stringify(fastJson));
            renderAll();
          } else {
            throw new Error("Bad initial payload");
          }

          // Then immediately verify the active month without cache (~1.7s)
          const monthRes = await fetch(
            `${apiUrl}${sep}action=month&month=${encodeURIComponent(state.selectedMonth)}&nocache=1`,
            { redirect: "follow", signal }
          );
          const monthJson = await monthRes.json();
          if (gen !== state.syncGeneration) return;
          if (monthJson && monthJson.ok && monthJson.month) {
            mergeSingleMonth(monthJson.month);
          }
          state.syncStatus = "synced";
          state.lastSyncTimestamp = Date.now();
          renderAll();
          if (showFeedback) showToast("Synced with Google Sheet");
          return;
        }

        // Returning visitor on auto-sync: refresh active month first (~1.7s) for instant freshness
        if (!showFeedback && state.selectedMonth) {
          try {
            const monthRes = await fetch(
              `${apiUrl}${sep}action=month&month=${encodeURIComponent(state.selectedMonth)}&nocache=1`,
              { redirect: "follow", signal }
            );
            const monthJson = await monthRes.json();
            if (gen !== state.syncGeneration) return;
            if (monthJson && monthJson.ok && monthJson.month) {
              mergeSingleMonth(monthJson.month);
              renderAll();
            }
          } catch (monthErr) {
            if (monthErr && monthErr.name === "AbortError") return;
            // Fall through to full workbook fetch
          }
        }

        const res = await fetch(`${apiUrl}${sep}action=all&nocache=1`, { redirect: "follow", signal });
        const json = await res.json();
        if (gen !== state.syncGeneration) return;
        if (json && json.ok) {
          state.data = json;
          state.syncStatus = "synced";
          state.lastSyncTimestamp = Date.now();
          localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, JSON.stringify(json));
          renderAll();
          if (showFeedback) showToast("Synced with Google Sheet");
        } else {
          state.syncStatus = "error";
          renderSyncStatus();
          if (showFeedback) showToast("Could not refresh schedule", true);
        }
      } catch (err) {
        if ((err && err.name === "AbortError") || gen !== state.syncGeneration) return;
        state.syncStatus = "error";
        renderAll();
        if (showFeedback) showToast("Could not reach server — using cached schedule", true);
      } finally {
        if (state.syncAbortController === controller) {
          state.syncAbortController = null;
          state.syncInFlight = false;
        }
      }
    }

    // =========================================================================
    // HELPERS
    // =========================================================================

    function cleanDisplayVolunteer(raw) {
      if (!raw) return "";
      return String(raw).replace(/\s*\(as\s+[^)]+\)/i, "").trim();
    }

    function isParentMatch(cellVolunteer, selectedParent) {
      if (!cellVolunteer || !selectedParent) return false;
      const a = cellVolunteer.toLowerCase();
      const b = selectedParent.toLowerCase();
      if (a === b || a.includes(b) || b.includes(a)) return true;
      const aParts = cleanDisplayVolunteer(cellVolunteer).toLowerCase().split(/\s+/);
      const bParts = selectedParent.toLowerCase().split(/\s+/);
      return aParts.length >= 2 && bParts.length >= 2 && aParts[0] === bParts[0] && aParts[aParts.length - 1] === bParts[bParts.length - 1];
    }

    function doesSlotNeedSub(day, slot) {
      if (!slot || !slot.editable || slot.isNA) return false;
      const notes = (day.notes || "").toLowerCase();
      if (!notes.includes("sub needed")) return false;
      const vol = cleanDisplayVolunteer(slot.volunteer).toLowerCase();
      const shortRole = (slot.shortLabel || "").toLowerCase();
      return (vol && notes.includes(vol)) || (shortRole && notes.includes(shortRole));
    }

    function isDayScheduled(day) {
      if (!day.isExtraDetails) return true;
      // Hide placeholder Extra Details columns that have no date and only generic "e.g. event name" text
      const hasRealDate = Boolean(day.isoDate);
      const hasRealNotes = Boolean(day.calendarNotes && !/e\.g\.\s*event\s*name/i.test(day.calendarNotes));
      const hasAnyVolunteer = (day.slots || []).some(s => s.volunteer && s.volunteer !== "N/A");
      return hasRealDate || hasRealNotes || hasAnyVolunteer;
    }

    function getVisibleSlots(day) {
      const isWed = /^wed/i.test(day.dayOfWeek || "");
      return (day.slots || []).filter(s => {
        if (s.roleKey === "homework") {
          if (s.isNA || /^n\/?a$/i.test(s.volunteer || "")) return false;
          if (!isWed && !s.volunteer) return false;
        }
        return true;
      });
    }

    function findAllUpcomingShifts() {
      const todayIso = getTodayIsoLA();
      const myShifts = [];
      const openOrSubSlots = [];

      (state.data.months || []).forEach(m => {
        (m.days || []).forEach(day => {
          if (day.status === "NO SCHOOL") return;
          if (!isDayScheduled(day)) return;
          if (day.isoDate && day.isoDate < todayIso) return;

          getVisibleSlots(day).forEach(slot => {
            if (state.selectedParent && isParentMatch(slot.volunteer, state.selectedParent)) {
              myShifts.push({ day, slot });
            }
            const isEmpty = !slot.volunteer || slot.volunteer.trim() === "";
            const subNeeded = doesSlotNeedSub(day, slot);
            if (subNeeded || (isEmpty && !day.isExtraDetails)) {
              openOrSubSlots.push({ day, slot, subNeeded, isEmpty });
            }
          });
        });
      });

      return { myShifts, openOrSubSlots };
    }

    // =========================================================================
    // RENDERING
    // =========================================================================

    function renderAll() {
      renderSyncStatus();

      // Update header identity pill
      const idBtn = document.getElementById("identityBtn");
      const idText = document.getElementById("identityBtnText");
      if (state.selectedParent) {
        idBtn.classList.remove("unselected");
        idText.textContent = state.selectedParent;
      } else {
        idBtn.classList.add("unselected");
        idText.textContent = "Who are you?";
      }

      if (!state.data) {
        const main = document.getElementById("mainContainer");
        if (state.syncStatus === "error") {
          main.innerHTML = `
            <div class="empty-state">
              <p style="font-weight: 700; margin: 0 0 6px;">Could not load schedule</p>
              <p style="font-size: 0.84rem; color: var(--ink-secondary); margin: 0 0 14px;">Check your connection and try again.</p>
              <button type="button" class="primary-cta" data-action="retry-sync" style="max-width: 180px;">Retry Sync</button>
            </div>
          `;
        } else {
          main.innerHTML = `
            <div class="skeleton-card">
              <div class="skeleton-bar" style="width: 48%; height: 15px; margin-bottom: 12px;"></div>
              <div class="skeleton-bar" style="width: 90%; margin-bottom: 8px;"></div>
              <div class="skeleton-bar" style="width: 72%;"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton-bar" style="width: 42%; height: 15px; margin-bottom: 12px;"></div>
              <div class="skeleton-bar" style="width: 85%; margin-bottom: 8px;"></div>
              <div class="skeleton-bar" style="width: 64%;"></div>
            </div>
          `;
        }
        return;
      }

      // Update mode tabs & counts
      document.querySelectorAll("[data-filter-mode]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filterMode === state.mode);
      });

      const { myShifts, openOrSubSlots } = findAllUpcomingShifts();
      const myCountEl = document.getElementById("myShiftsCount");
      const openCountEl = document.getElementById("openCount");

      myCountEl.textContent = String(myShifts.length);
      myCountEl.hidden = myShifts.length === 0;

      openCountEl.textContent = String(openOrSubSlots.length);
      openCountEl.hidden = openOrSubSlots.length === 0;

      document.getElementById("footerPastToggleBtn").textContent = state.showPast ? "Hide Past Dates" : "Show Past Dates";

      const main = document.getElementById("mainContainer");
      if (state.mode === "mine") {
        main.innerHTML = renderMyShiftsMode(myShifts);
      } else if (state.mode === "open") {
        main.innerHTML = renderOpenMode(openOrSubSlots);
      } else {
        main.innerHTML = renderScheduleMode(myShifts);
      }
    }

    function renderScheduleMode(myShifts) {
      const todayIso = getTodayIsoLA();
      let html = "";

      // 1. Personal Next Shift Spotlight (if logged in and has an upcoming shift)
      if (state.selectedParent && myShifts.length > 0) {
        const next = myShifts[0];
        html += `
          <div class="next-shift-banner">
            <div class="next-shift-top">
              <div>
                <div style="font-size: 0.72rem; font-weight: 700; color: var(--cape-blue);">YOUR NEXT SHIFT</div>
                <div style="font-family: var(--font-display); font-weight: 700; font-size: 1rem;">
                  ${escapeHtml(next.day.dayOfWeek)} ${escapeHtml(next.day.dateDisplay)} · ${escapeHtml(next.slot.shortLabel)}
                </div>
                <div style="font-size: 0.78rem; color: var(--ink-secondary);" class="tabular-nums">${escapeHtml(next.slot.timeWindow)}</div>
              </div>
            </div>
            <div class="next-shift-actions">
              <button type="button" class="mini-btn maroon"
                data-action="open-slot"
                data-month="${escapeAttr(next.day.month)}"
                data-col="${next.day.colIndex}"
                data-role="${escapeAttr(next.slot.roleKey)}">
                Need a Sub / Swap
              </button>
              <button type="button" class="mini-btn"
                data-action="add-calendar"
                data-month="${escapeAttr(next.day.month)}"
                data-col="${next.day.colIndex}"
                data-role="${escapeAttr(next.slot.roleKey)}">
                + Add to Calendar
              </button>
            </div>
          </div>
        `;
      }

      // 2. Horizontal Month Selector
      const months = state.data.months || [];
      const activeMonth = months.find(m => m.tabName === state.selectedMonth) || months[0];

      html += `
        <div class="month-strip" role="tablist">
          ${months.map(m => `
            <button type="button" class="month-pill ${m.tabName === activeMonth.tabName ? "active" : ""}"
              data-action="select-month" data-month="${escapeAttr(m.tabName)}">
              ${escapeHtml(m.tabName)}
            </button>
          `).join("")}
        </div>
      `;

      // 3. Compact Collapsible Monthly Roles Drawer (Artist, Composer, Room Parent Assist, Work-at-home)
      const footerRoles = activeMonth.footerRoles || [];
      if (footerRoles.length > 0) {
        html += `
          <details class="monthly-roles-drawer">
            <summary>
              <span>${escapeHtml(activeMonth.tabName)} Monthly Roles (Artist, Composer…)</span>
              <span style="font-size: 0.75rem; color: var(--cape-maroon);">View / Edit ▾</span>
            </summary>
            <div style="padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-hairline);">
              ${footerRoles.map(r => `
                <button type="button" class="vol-chip ${state.selectedParent && isParentMatch(r.volunteer, state.selectedParent) ? "is-mine" : ""}"
                  data-action="open-footer"
                  data-month="${escapeAttr(activeMonth.tabName)}"
                  data-footer-key="${escapeAttr(r.footerKey)}">
                  <div>
                    <div style="font-size: 0.72rem; color: var(--ink-tertiary); font-weight: 700;">${escapeHtml(r.roleLabel)}</div>
                    <div style="font-size: 0.86rem; font-weight: 700;">${escapeHtml(r.volunteer || "Open — Tap to sign up")}</div>
                  </div>
                  <span class="chip-right">Edit</span>
                </button>
              `).join("")}
            </div>
          </details>
        `;
      }

      // 4. Filter days for the selected month
      const visibleDays = (activeMonth.days || []).filter(day => {
        if (!isDayScheduled(day)) return false;
        if (!state.showPast && activeMonth.tabName === determineDefaultMonth(todayIso) && day.isoDate && day.isoDate < todayIso) {
          return false;
        }
        return true;
      });

      if (visibleDays.length === 0) {
        html += `
          <div class="empty-state">
            <p style="font-weight: 700; margin: 0 0 6px;">All remaining days this month are in the past</p>
            <button type="button" class="mini-btn" data-action="toggle-past" style="max-width: 200px; margin: 8px auto 0; display: block;">
              Show Past Dates in ${escapeHtml(activeMonth.tabName)}
            </button>
          </div>
        `;
        return html;
      }

      // Group consecutive NO SCHOOL days into a single compact line
      let i = 0;
      while (i < visibleDays.length) {
        const d = visibleDays[i];
        if (d.status === "NO SCHOOL") {
          const group = [d];
          while (i + 1 < visibleDays.length && visibleDays[i + 1].status === "NO SCHOOL") {
            group.push(visibleDays[i + 1]);
            i++;
          }
          const label = group.length === 1
            ? `${group[0].dayOfWeek} ${group[0].dateDisplay}`
            : `${group[0].dateDisplay} – ${group[group.length - 1].dateDisplay}`;
          html += `
            <div class="no-school-row">
              <span><strong>No School:</strong> ${escapeHtml(label)}</span>
              <span>${escapeHtml((group[0].calendarNotes || "School Closed").split(".")[0])}</span>
            </div>
          `;
          i++;
        } else {
          html += renderCompactDayCard(d, todayIso);
          i++;
        }
      }

      return html;
    }

    function renderCompactDayCard(day, todayIso) {
      const isToday = day.isoDate === todayIso;
      const isMinDay = day.status === "Minimum day";
      const isSpecial = day.status === "Field trip" || day.status === "Party day" || day.isExtraDetails;

      const slots = getVisibleSlots(day);
      const centersSlots = slots.filter(s => s.roleKey.startsWith("centers"));
      const homeworkSlot = slots.find(s => s.roleKey === "homework");
      const openCount = slots.filter(s => !cleanDisplayVolunteer(s.volunteer)).length;

      let statusBadgeHtml = "";
      if (openCount > 0) {
        statusBadgeHtml += `<span class="badge open-alert">${openCount} Open</span>`;
      }
      if (isMinDay) {
        statusBadgeHtml += `<span class="badge min-day">Minimum Day</span>`;
      } else if (isSpecial) {
        statusBadgeHtml += `<span class="badge special">${escapeHtml(day.status)}</span>`;
      }

      return `
        <article class="day-card ${isMinDay ? "min-day" : ""} ${isSpecial ? "special-day" : ""} ${isToday ? "today-card" : ""} ${openCount > 0 ? "has-open-slots" : ""}">
          <div class="day-header">
            <div style="display: flex; align-items: baseline; gap: 7px;">
              <span class="day-title">${escapeHtml(day.dayOfWeek)} ${escapeHtml(day.dateDisplay)}</span>

      return { month: m, day, slot };

    function enqueueMutation(taskFn) {
      state.pendingMutations += 1;
      abortInFlightSync();
      state.syncGeneration += 1;
      state.syncStatus = "saving";
      renderSyncStatus();

      const run = async () => {
        try {
          await taskFn();
        } finally {
          state.pendingMutations = Math.max(0, state.pendingMutations - 1);
          if (state.pendingMutations === 0 && state.syncStatus === "saving") {
            state.syncStatus = state.lastSyncTimestamp ? "synced" : "idle";
            renderSyncStatus();
          }
        }
      };

      mutationChain = mutationChain.then(run, run);
      return mutationChain;
    }

    function restoreSnapshot(snapshotJson) {
      state.data = JSON.parse(snapshotJson);
      localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, snapshotJson);
      renderAll();
    }

    function submitFooterMutation(payload) {
      return enqueueMutation(async () => {
        const snapshot = JSON.stringify(state.data);
        const m = (state.data && state.data.months || []).find(x => x.tabName === payload.month);
        const role = m && (m.footerRoles || []).find(r => r.footerKey === payload.footerKey);
        if (role) role.volunteer = payload.newValue;
        localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, JSON.stringify(state.data));
        renderAll();

        const apiUrl = getApiUrl();
        if (!apiUrl) {
          showToast("Saved locally — connect Apps Script URL to sync to Google Sheet", true);
          return;
        }

        try {
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow",
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (!json || !json.ok) {
            restoreSnapshot(snapshot);
            showToast((json && json.message) || "Could not save monthly role", true);
            if (json && json.code === "CONFLICT") syncFromServer(true, true, true);
            return;
          }
          if (json.month) mergeSingleMonth(json.month);
          state.syncGeneration += 1;
          state.syncStatus = "synced";
          state.lastSyncTimestamp = Date.now();
          renderAll();
          showToast("Saved to Google Sheet");
        } catch (_) {
          restoreSnapshot(snapshot);
          showToast("Error saving monthly role", true);
        }
      });
    }

    function submitSlotMutation(payload, isUndo = false) {
      const dlg = document.getElementById("actionSheet");
      if (dlg && dlg.open) dlg.close();

      return enqueueMutation(async () => {
        const foundBefore = findDayAndSlot(payload.month, payload.colIndex, payload.roleKey);
        const prevVolunteerRaw = foundBefore && foundBefore.slot ? (foundBefore.slot.volunteer || "") : "";

        const snapshot = JSON.stringify(state.data);
        applyOptimisticChange(payload);
        localStorage.setItem(STORAGE_KEYS.SCHEDULE_CACHE, JSON.stringify(state.data));
        renderAll();

        const apiUrl = getApiUrl();
        if (!apiUrl) {
          showToast("Saved locally — connect Apps Script URL to sync to Google Sheet", true);
          return;
        }

        try {
          const res = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow",
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (!result || !result.ok) {
            restoreSnapshot(snapshot);
            showToast((result && result.message) || "Could not save change", true);
            if (result && result.code === "CONFLICT") syncFromServer(true, true, true);
            return;
          }
          if (result.month) {
            mergeSingleMonth(result.month);
          }
          state.syncGeneration += 1;
          state.syncStatus = "synced";
          state.lastSyncTimestamp = Date.now();
          renderAll();

          let undoFn = null;
          if (!isUndo && ["CLAIM", "CLEAR", "DIRECT", "SUB"].includes(payload.action)) {
            const currentAfter = payload.action === "CLEAR" ? "" : (payload.newVolunteer || "");
            undoFn = () => {
              const undoActionType = prevVolunteerRaw ? (payload.action === "CLEAR" ? "CLAIM" : "DIRECT") : "CLEAR";
              submitSlotMutation({
                action: undoActionType,
                month: payload.month,
                colIndex: payload.colIndex,
                roleKey: payload.roleKey,
                expectedPreviousValue: currentAfter,
                newVolunteer: prevVolunteerRaw,
                actorName: payload.actorName,
                comment: "Undo previous change"
              }, true);
            };
          }
          showToast(isUndo ? "Undone in Google Sheet" : "Saved to Google Sheet", false, undoFn);
        } catch (err) {
          restoreSnapshot(snapshot);
          showToast("Network error while saving", true);
        }
      });
    }

    function applyOptimisticChange(payload) {
      const found = findDayAndSlot(payload.month, payload.colIndex, payload.roleKey);
      if (!found) return;
      const { day, slot } = found;
      const shortRole = slot.shortLabel || slot.roleKey;
      const prev = cleanDisplayVolunteer(slot.volunteer);

      if (payload.action === "NEED_SUB") {
        const holder = prev || payload.actorName;
        const flag = `SUB NEEDED for ${holder} (${shortRole})` + (payload.comment ? ` - ${payload.comment}` : "");
        day.notes = day.notes ? `${day.notes} | ${flag}` : flag;
      } else if (payload.action === "SUB") {
        slot.volunteer = payload.newVolunteer;
        const subNote = prev ? `${payload.newVolunteer} subbing for ${prev} (${shortRole})` : `${payload.newVolunteer} claimed ${shortRole}`;
        day.notes = day.notes ? `${day.notes} | ${subNote}` : subNote;
      } else if (payload.action === "CLAIM" || payload.action === "DIRECT") {
        slot.volunteer = payload.newVolunteer;
      } else if (payload.action === "CLEAR") {
        slot.volunteer = "";
      }
    }

              data-pick-parent="${escapeAttr(name)}">
              <span>${escapeHtml(name)}</span>
              <span class="chip-right">${state.selectedParent === name ? "Selected ✓" : "Select"}</span>
            </button>
          `).join("")}
        </div>

        <form id="customNameForm" style="margin-top: 12px; display: flex; gap: 8px;">
          <input type="text" id="customNameInput" class="form-input" placeholder="Or type your full name…" />
          <button type="submit" class="primary-cta" style="width: auto; padding: 10px 14px;">Save</button>
        </form>
      `;

      panel.querySelectorAll("[data-pick-parent]").forEach(btn => {
        btn.addEventListener("click", () => {
          saveParentIdentity(btn.dataset.pickParent);
          dlg.close();
        });
      });

      panel.querySelector("#customNameForm").addEventListener("submit", e => {
        e.preventDefault();
        const val = document.getElementById("customNameInput").value.trim();
        if (val) {
          saveParentIdentity(val);
          dlg.close();
        }
      });

      if (!dlg.open) dlg.showModal();
    }

    function saveParentIdentity(name) {
      state.selectedParent = name;
      if (name) {
        localStorage.setItem(STORAGE_KEYS.PARENT_NAME, name);
        showToast(`Viewing as ${name}`);
      } else {
        localStorage.removeItem(STORAGE_KEYS.PARENT_NAME);
      }
      renderAll();
    }

    function openCalendarSheet(monthName, colIndex, roleKey) {
      const found = findDayAndSlot(monthName, colIndex, roleKey);
      if (!found || !found.day || !found.slot) return;
      const { day, slot } = found;
      if (!day.isoDate) return;

      const dCompact = day.isoDate.replace(/-/g, "");
      const sCompact = (slot.startTime || "08:15").replace(":", "") + "00";
      const eCompact = (slot.endTime || "09:45").replace(":", "") + "00";
      const title = `CAPE Volunteer: ${slot.roleLabel} (Mrs. White)`;
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dCompact}T${sCompact}/${dCompact}T${eCompact}&ctz=America/Los_Angeles&location=${encodeURIComponent("CAPE - Mrs. White's Classroom")}`;

      const dlg = document.getElementById("actionSheet");
      const panel = document.getElementById("actionSheetPanel");

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <h3 class="sheet-title">Add to Calendar</h3>
            <div class="sheet-subtitle">${escapeHtml(day.dayOfWeek)} ${escapeHtml(day.dateDisplay)} · ${escapeHtml(slot.timeWindow)}</div>
          </div>
          <button type="button" class="close-btn" data-action="close-sheet">✕</button>
        </div>
        <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px;">
          <a href="${escapeAttr(gcalUrl)}" target="_blank" rel="noopener" class="primary-cta" style="text-decoration: none; display: block;">
            Open in Google Calendar
          </a>
          <button type="button" class="secondary-cta" id="dlIcsBtn">
            Download Apple / Outlook Calendar (.ics)
          </button>
        </div>
      `;

      panel.querySelector("#dlIcsBtn").addEventListener("click", () => {
        const ics = [
          "BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
          `DTSTART;TZID=America/Los_Angeles:${dCompact}T${sCompact}`,
          `DTEND;TZID=America/Los_Angeles:${dCompact}T${eCompact}`,
          `SUMMARY:${title}`, "LOCATION:CAPE - Mrs. White's Classroom",
          "END:VEVENT", "END:VCALENDAR"
        ].join("\r\n");
        const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `CAPE_Volunteer_${dCompact}.ics`;
        a.click();
        dlg.close();
      });

      if (!dlg.open) dlg.showModal();
    }

    function escapeIcsText(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/\r?\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
    }

    function exportAllMyShiftsIcs() {
      if (!state.data || !state.selectedParent) return;
      const { myShifts } = findAllUpcomingShifts();
      const validShifts = myShifts.filter(({ day }) => day && day.isoDate);
      if (validShifts.length === 0) {
        showToast("No upcoming dated shifts to export", true);
        return;
      }

      const nowUtc = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//CAPE//Mrs White Volunteers//EN",
        "CALSCALE:GREGORIAN",
        "X-WR-CALNAME:Mrs. White's Class Volunteers",
        "X-WR-TIMEZONE:America/Los_Angeles"
      ];

      validShifts.forEach(({ day, slot }) => {
        const dCompact = day.isoDate.replace(/-/g, "");
        const sCompact = (slot.startTime || "08:15").replace(":", "") + "00";
        const eCompact = (slot.endTime || "09:45").replace(":", "") + "00";
        const title = `CAPE Volunteer: ${slot.roleLabel} (Mrs. White)`;
        const descParts = [];
        if (day.status === "Minimum day") descParts.push("Minimum Day — confirm Centers time with Mrs. White.");
        if (day.calendarNotes) descParts.push(day.calendarNotes);
        if (day.notes) descParts.push(day.notes);

        lines.push(
          "BEGIN:VEVENT",
          `UID:${dCompact}-${slot.roleKey}-${day.colIndex}@cape-volunteers`,
          `DTSTAMP:${nowUtc}`,
          `DTSTART;TZID=America/Los_Angeles:${dCompact}T${sCompact}`,
          `DTEND;TZID=America/Los_Angeles:${dCompact}T${eCompact}`,
          `SUMMARY:${escapeIcsText(title)}`,
          "LOCATION:CAPE - Mrs. White's Classroom"
        );
        if (descParts.length > 0) {
          lines.push(`DESCRIPTION:${escapeIcsText(descParts.join(" | "))}`);
        }
        lines.push("END:VEVENT");
      });

      lines.push("END:VCALENDAR");
      const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      const safeName = state.selectedParent.replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_|_$/g, "") || "Schedule";
      a.download = `CAPE_Volunteers_${safeName}.ics`;
      a.click();
      showToast(`Downloaded ${validShifts.length} shift${validShifts.length === 1 ? "" : "s"} (.ics)`);
    }

    async function openActivitySheet() {
      const dlg = document.getElementById("actionSheet");
      const panel = document.getElementById("actionSheetPanel");

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <h3 class="sheet-title">Recent Changes</h3>
            <div class="sheet-subtitle">Latest updates from _Audit_Log</div>
          </div>
          <button type="button" class="close-btn" data-action="close-sheet">✕</button>
        </div>
        <div id="activityBody" style="margin-top: 12px; font-size: 0.84rem; color: var(--ink-secondary);">
          Loading recent changes…
        </div>
      `;
      if (!dlg.open) dlg.showModal();

      const apiUrl = getApiUrl();
      const body = document.getElementById("activityBody");
      if (!apiUrl) {
        body.innerHTML = `<p style="margin: 0;">Connect the Google Sheet backend to view recent changes.</p>`;
        return;
      }

      const reqId = ++state.activityReqId;
      try {
        const sep = apiUrl.includes("?") ? "&" : "?";
        const res = await fetch(`${apiUrl}${sep}action=activity&limit=20`, { redirect: "follow" });
        const json = await res.json();
        if (reqId !== state.activityReqId || document.getElementById("activityBody") !== body) return;
        if (!json || !json.ok || !Array.isArray(json.entries)) {
          body.innerHTML = `<p style="margin: 0;">Redeploy <code>Code.gs</code> in Apps Script to enable the live Recent Changes feed.</p>`;
          return;
        }
        if (json.entries.length === 0) {
          body.innerHTML = `<p style="margin: 0;">No changes have been recorded yet.</p>`;
          return;
        }
        body.innerHTML = `
          <div style="max-height: 55dvh; overflow-y: auto; border: 1px solid var(--border-hairline); border-radius: 10px;">
            ${json.entries.map(item => {
              let when = item.timestamp || "";
              try {
                when = new Date(item.timestamp).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
              } catch (_) {}
              const change = item.previousValue && item.newValue
                ? `${escapeHtml(item.previousValue)} → ${escapeHtml(item.newValue)}`
                : item.newValue
                  ? `Set to ${escapeHtml(item.newValue)}`
                  : item.previousValue
                    ? `Cleared (${escapeHtml(item.previousValue)})`
                    : escapeHtml(item.actionType);
              return `
                <div style="padding: 9px 12px; border-bottom: 1px solid var(--border-hairline); font-size: 0.8rem;">
                  <div style="display: flex; justify-content: space-between; gap: 8px;">
                    <strong style="color: var(--ink-primary);">${escapeHtml(item.actorName || "Parent")}</strong>
                    <span style="color: var(--ink-tertiary); font-size: 0.72rem;">${escapeHtml(when)}</span>
                  </div>
                  <div style="color: var(--ink-secondary); margin-top: 2px;">
                    ${escapeHtml(item.dateLabel || item.month)} · ${escapeHtml(item.roleLabel)} — ${change}
                  </div>
                  ${item.comment ? `<div style="color: var(--ink-tertiary); font-size: 0.74rem; margin-top: 2px;">Note: ${escapeHtml(item.comment)}</div>` : ""}
                </div>
              `;
            }).join("")}
          </div>
        `;
      } catch (_) {
        body.innerHTML = `<p style="margin: 0;">Could not load recent changes right now.</p>`;
      }
    }

    function openRosterSheet() {
      const dlg = document.getElementById("actionSheet");
      const panel = document.getElementById("actionSheetPanel");
      const entries = (state.data && state.data.roster && state.data.roster.entries) || [];

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <h3 class="sheet-title">Original Sign-Ups</h3>
            <div class="sheet-subtitle">Baseline recurring schedule from ParentSquare</div>
          </div>
          <button type="button" class="close-btn" data-action="close-sheet">✕</button>
        </div>
        <div style="margin-top: 10px; max-height: 55dvh; overflow-y: auto; border: 1px solid var(--border-hairline); border-radius: 10px;">
          ${entries.map(r => `
            <div style="padding: 8px 12px; border-bottom: 1px solid var(--border-hairline); font-size: 0.82rem;">
              <div style="font-weight: 700;">${escapeHtml(cleanDisplayVolunteer(r.volunteer))}</div>
              <div style="color: var(--ink-secondary);">${escapeHtml(r.day)} · ${escapeHtml(r.role)} (${escapeHtml(r.time)})</div>
            </div>
          `).join("")}
        </div>
      `;
      if (!dlg.open) dlg.showModal();
    }

    function openApiConfigSheet() {
      const dlg = document.getElementById("actionSheet");
      const panel = document.getElementById("actionSheetPanel");
      const currentUrl = getApiUrl();

      panel.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div>
            <h3 class="sheet-title">Connect Google Sheet API</h3>
            <div class="sheet-subtitle">Paste your deployed Google Apps Script Web App URL</div>
          </div>
          <button type="button" class="close-btn" data-action="close-sheet">✕</button>
        </div>

        <form id="apiUrlForm" style="margin-top: 14px;">
          <div class="form-field">
            <label class="form-label" for="apiUrlInput">Apps Script Web App URL (ends in /exec)</label>
            <input type="url" id="apiUrlInput" class="form-input"
              placeholder="https://script.google.com/macros/s/.../exec"
              value="${escapeAttr(currentUrl)}" required />
          </div>
          <p style="font-size: 0.78rem; color: var(--ink-secondary); margin: 0 0 12px;">
            Once verified, paste this URL into <code>DEFAULT_APPS_SCRIPT_URL</code> in <code>index.html</code> so every parent gets live sync automatically.
          </p>
          <button type="submit" class="primary-cta">Connect &amp; Sync Now</button>
        </form>
      `;

      panel.querySelector("#apiUrlForm").addEventListener("submit", e => {
        e.preventDefault();
        const url = document.getElementById("apiUrlInput").value.trim();
        if (url) {
          localStorage.setItem(STORAGE_KEYS.API_URL_OVERRIDE, url);
          dlg.close();
          syncFromServer(true);
        }
      });

      if (!dlg.open) dlg.showModal();
    }

    // =========================================================================
    // EVENTS
    // =========================================================================

    function bindEvents() {
      document.getElementById("identityBtn").addEventListener("click", openIdentitySheet);
      document.getElementById("headerSyncBtn").addEventListener("click", () => syncFromServer(true, true));

      document.querySelectorAll("[data-filter-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.mode = btn.dataset.filterMode;
          renderAll();
        });
      });

      document.getElementById("footerSyncBtn").addEventListener("click", () => syncFromServer(true, true));
      document.getElementById("footerActivityBtn").addEventListener("click", openActivitySheet);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && getApiUrl() && Date.now() - state.lastSyncTimestamp > 20000) {
          syncFromServer(false, true);
        }
      });
      window.addEventListener("online", () => {
        if (getApiUrl()) syncFromServer(false, true);
      });
      window.addEventListener("storage", e => {
        if (e.key === STORAGE_KEYS.SCHEDULE_CACHE && e.newValue && state.pendingMutations === 0) {
          try {
            state.data = JSON.parse(e.newValue);
            renderAll();
          } catch (_) {}
        } else if (e.key === STORAGE_KEYS.PARENT_NAME) {
          state.selectedParent = e.newValue || "";
          renderAll();
        }
      });
      document.getElementById("footerRosterBtn").addEventListener("click", openRosterSheet);
      document.getElementById("footerPastToggleBtn").addEventListener("click", () => {
        state.showPast = !state.showPast;
        renderAll();
      });

      const dlg = document.getElementById("actionSheet");
      dlg.addEventListener("click", e => {
        if (e.target === dlg) dlg.close();
      });

      document.addEventListener("click", e => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        const act = el.dataset.action;

        if (act === "select-month") {
          state.selectedMonth = el.dataset.month;
          renderAll();
        } else if (act === "toggle-past") {
          state.showPast = !state.showPast;
          renderAll();
        } else if (act === "open-identity") {
          openIdentitySheet();
        } else if (act === "open-slot") {
          openContextSlotSheet(el.dataset.month, Number(el.dataset.col), el.dataset.role);
        } else if (act === "open-footer") {
          openFooterModal(el.dataset.month, el.dataset.footerKey);
        } else if (act === "add-calendar") {
          openCalendarSheet(el.dataset.month, Number(el.dataset.col), el.dataset.role);
        } else if (act === "export-all-ics") {
          exportAllMyShiftsIcs();
        } else if (act === "retry-sync") {
          syncFromServer(true, true);
        } else if (act === "close-sheet") {
          dlg.close();
        }
      });
    }

    let toastTimer = null;
    function showToast(msg, isErr = false, undoAction = null) {
      const c = document.getElementById("toastContainer");
      clearTimeout(toastTimer);
      c.hidden = false;
      c.innerHTML = `
        <div class="toast-box ${isErr ? "error" : ""}">
          <span>${escapeHtml(msg)}</span>
          ${undoAction ? `<button type="button" class="toast-undo-btn" id="toastUndoBtn">Undo</button>` : ""}
        </div>
      `;
      if (undoAction) {
        const undoBtn = document.getElementById("toastUndoBtn");
        if (undoBtn) {
          undoBtn.addEventListener("click", () => {
            clearTimeout(toastTimer);
            c.hidden = true;
            undoAction();
          });
        }
      }
      toastTimer = setTimeout(() => { c.hidden = true; }, undoAction ? 6000 : 3200);
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    const escapeAttr = escapeHtml;

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
